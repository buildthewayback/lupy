# Lupy macOS app — generated into Lupy.xcodeproj by XcodeGen (brew install xcodegen; xcodegen).
# Pattern adapted from Coucou's NotchBuddy/project.yml (MIT). No packages: Apple frameworks only.
name: Lupy
options:
  bundleIdPrefix: app.lupy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Lupy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      - path: ../LupyCore/Sources/LupyCore
        type: group
        name: LupyCore
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Lupy
        CFBundleDisplayName: Lupy
        CFBundleIdentifier: app.lupy.Lupy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: YES
        NSHumanReadableCopyright: "Lupy. Includes MIT-licensed code adapted from Coucou (c) 2026 Louis Raillé."
        NSMicrophoneUsageDescription: "Lupy uses the microphone only while you hold the dictation button, to turn your voice into text you can review before sending."
        NSSpeechRecognitionUsageDescription: "Lupy turns your dictation into text. When your Mac supports it, recognition happens on this Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lupy.Lupy
        PRODUCT_NAME: Lupy
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Lupy:
    build:
      targets:
        Lupy: all
    run:
      config: Debug
    archive:
      config: Release
