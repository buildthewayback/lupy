# THE PRODUCT PIPELINE — GitHub's own Mac builds the reference app with the repo's
# proven scripts, packs a DMG, publishes a Release. The founder downloads ONE file.
name: release-macos
on:
  push:
    tags: ["lupy3-*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest          # the label with a proven success in this repo
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen (the project generator build-mac-app.sh expects)
        run: brew install xcodegen

      - name: Reference build — Lupy.app, ad-hoc signed, zipped (proven script)
        run: bash scripts/build-mac-app.sh

      - name: Native smoke evidence on the built app
        continue-on-error: true
        run: bash scripts/smoke-mac-app.sh || true

      - name: Pack the DMG (Lupy.app + Applications symlink, drag-to-install)
        run: |
          mkdir -p dist stage
          unzip -q dist/Lupy-*.zip -d stage
          ln -s /Applications stage/Applications
          hdiutil create -volname "Lupy" -srcfolder stage -ov -format UDZO dist/Lupy.dmg
          shasum -a 256 dist/Lupy.dmg | tee dist/Lupy.dmg.sha256

      - name: Publish Release with the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "$TAG" dist/Lupy.dmg dist/Lupy.dmg.sha256 dist/Lupy-*.zip \
            --title "LUPY 3 — ${TAG}" --notes-file docs/RELEASE_NOTES.md
