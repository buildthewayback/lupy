# COMPILE ORACLE — a clean GitHub Mac proves the product before the founder
# ever runs the installer: his exact no-Xcode road, the native core tests,
# bash-3.2 installer rehearsal, the sandbox councils on real macOS, and the
# app's own headless self-tests. Born after the founder's Mac served as the
# project's only compiler for four field runs; live since the repo went
# public (2026-10-21) — standard runners are free for public repositories.
# Triggers on pushes to arena/* branches and on PRs (never on main pushes:
# the tag is only ever pointed at already-proven trees).
name: compile-check
on:
  push:
    branches: ["arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Free arm64 pools starve in waves (two 15-min acquisition give-ups on
    # 2026-10-21): race all three standard arm64 labels — first Mac that
    # materializes gives the verdict. Public-repo minutes are free, so the
    # duplicate runs cost nothing. Intel labels are out on purpose: the
    # founder's road builds arm64 (`arch -arm64 swift`).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain present
        run: |
          swift --version
          uname -m
          bash --version | head -1
          python3 --version

      - name: Installer rehearsal + councils on real macOS (bash 3.2 is the law)
        run: |
          bash -n "Install LUPY.app/Contents/MacOS/Install-LUPY" scripts/build-no-xcode.sh scripts/body-checks.sh scripts/beta-checks.sh
          bash tools/ui/installer-harness.sh | tail -1
          python3 tools/ui/audit_isolation.py | tail -1
          python3 tools/ui/audit_decls.py | tail -1
          python3 tools/ui/audit_xref.py | tail -1

      - name: Native core tests (real swiftc, Swift 6 mode)
        run: bash scripts/test-core.sh

      - name: The founder's road, verbatim — swift build, bundle, sign, no launch
        run: bash scripts/build-no-xcode.sh --no-launch

      - name: Prove the bundle
        run: |
          file build-noxcode/Lupy.app/Contents/MacOS/Lupy
          file build-noxcode/Lupy.app/Contents/MacOS/Lupy | grep -q arm64
          plutil -lint build-noxcode/Lupy.app/Contents/Info.plist
          test -f build-noxcode/Lupy.app/Contents/Resources/AppIcon.icns
          test -f build-noxcode/Lupy.app/Contents/Resources/MenuBarIcon.png
          test -d build-noxcode/Lupy.app/Contents/Resources/sounds
          codesign --verify --deep --strict build-noxcode/Lupy.app

      - name: Headless self-tests shipped in the binary
        run: |
          BIN=build-noxcode/Lupy.app/Contents/MacOS/Lupy
          "$BIN" --self-test --report /tmp/lupy-selftest.txt; echo "self-test exit: $?"
          "$BIN" --character-self-test; echo "character exit: $?"
        continue-on-error: true

      - name: Chat self-test (best-effort until its needs are mapped)
        run: |
          timeout 180 build-noxcode/Lupy.app/Contents/MacOS/Lupy --chat-self-test --report /tmp/lupy-chattest.txt || true
          tail -5 /tmp/lupy-chattest.txt 2>/dev/null || echo "(no chat report)"
        continue-on-error: true

      - name: Launch smoke — the pill must come alive (best-effort on a runner)
        run: |
          open build-noxcode/Lupy.app || true
          sleep 12
          pgrep -x Lupy && echo "ALIVE: Lupy process is running" || echo "no Lupy process (runner GUI limits?)"
          pkill -x Lupy || true
        continue-on-error: true

      - name: Keep the evidence either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            build-noxcode/build.log
            /tmp/lupy-selftest.txt
            /tmp/lupy-chattest.txt
          if-no-files-found: ignore
