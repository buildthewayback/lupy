# Lupy native macOS build — deliberately MANUAL to protect the Actions allowance.
#
# Runs only when:
#   - a pushed commit changes ci/mac-build-request.txt (deliberate build request), or
#   - someone clicks "Run workflow" on the Actions tab (workflow_dispatch).
# Other pushes do not start this workflow at all. Commit-message text never triggers it.
# macOS minutes cost ~10x Linux minutes; see docs/CI_BUDGET.md.
#
# Lupy for Mac is Coucou's macOS app (Mac/, Louis-CFM/coucou f09ac0b) extended with Lupy's assistant.
#
# Jobs
#   build  — LupyCore tests, Coucou's unit tests for the areas Lupy touches, Release build of Mac/,
#            ONE zip whose only item is Lupy.app, uploaded as a
#            single unwrapped file (archive: false): the artifact link downloads that zip itself,
#            not a zip-inside-a-zip. Kept 90 days.
#   verify — on fresh Macs (oldest supported macOS + newest), download that exact file back from
#            GitHub and use it like a person would: unzip, inspect, install, launch, self-test.
#            See scripts/verify-mac-download.sh.
name: Mac build (manual)

on:
  push:
    branches: ['arena/**']
    paths: ['ci/mac-build-request.txt']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this build is needed'
        required: false
        default: 'manual build'

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
      zip_sha256: ${{ steps.meta.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n machdep.cpu.brand_string || true

      - name: Core tests (native Swift)
        run: |
          set -o pipefail
          bash scripts/test-core.sh 2>&1 | tee core-tests.log

      - name: Coucou unit tests (areas Lupy touches) + Lupy wake-phrase test
        id: unittests
        run: |
          # Results are recorded here and enforced by the last step, so a test failure never hides
          # the build's own diagnostics in the same run (and never turns the run green).
          TESTS="test-screen-geometry test-island-hover test-auto-close test-display-choice test-desktop-mochi test-wardrobe test-pill-colors test-approval-queue test-safe-links test-voice-wake test-claude-hooks test-claude-settings"
          printf '%s\n' $TESTS | xargs -P 3 -I{} bash -c 'if bash Mac/Tests/coucou/{}.sh > "/tmp/{}.log" 2>&1; then echo "PASS {}"; else echo "FAIL {}"; tail -15 "/tmp/{}.log" | sed "s/^/    /"; fi' > coucou-tests.log
          if bash Mac/Tests/lupy/test-wake-lupy.sh > /tmp/wake-lupy.log 2>&1; then echo "PASS test-wake-lupy" >> coucou-tests.log; else echo "FAIL test-wake-lupy" >> coucou-tests.log; tail -10 /tmp/wake-lupy.log | sed "s/^/    /" >> coucou-tests.log; fi
          cat coucou-tests.log
          echo "failed=$(grep -c '^FAIL' coucou-tests.log || true)" >> "$GITHUB_OUTPUT"

      - name: Build and package Lupy.app
        run: |
          set -o pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          bash scripts/build-mac-app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Package facts
        id: meta
        run: |
          set -euo pipefail
          ls dist/*.zip > zips.txt
          test "$(wc -l < zips.txt | tr -d ' ')" = 1
          ZIP=$(cat zips.txt)
          {
            echo "zip_path=$ZIP"
            echo "zip_name=$(basename "$ZIP")"
            echo "zip_sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "zip_size=$(stat -f %z "$ZIP")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Upload the app (one file, not wrapped in a second zip)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.meta.outputs.zip_path }}
          archive: false
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      - name: Download link on the run page
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          ZIP_SHA: ${{ steps.meta.outputs.zip_sha256 }}
          ZIP_SIZE: ${{ steps.meta.outputs.zip_size }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "artifact url: $URL"
          echo "artifact digest: $DIGEST"
          {
            echo "## Download Lupy"
            echo ""
            echo "**[${ZIP_NAME}](${URL})** — ${ZIP_SIZE} bytes — SHA-256 \`${ZIP_SHA}\`"
            echo ""
            echo "The link downloads the zip itself. Double-click it to get **Lupy.app**, then drag Lupy into Applications."
            echo "GitHub artifact digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report back (check run with logs)
        if: always()
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        with:
          script: |
            const fs = require('fs');
            const read = (p, n) => { try { const s = fs.readFileSync(p, 'utf8'); return s.slice(-n); } catch { return '(missing)'; } };
            const summary = [
              '## Package', '```', read('dist/BUILD_INFO.txt', 3000), '```',
              `artifact id: ${process.env.ARTIFACT_ID || '(none)'}`,
              `artifact url: ${process.env.ARTIFACT_URL || '(none)'}`,
              `artifact digest: ${process.env.ARTIFACT_DIGEST || '(none)'}`,
              '## Compiler errors and result', '```', read('build/errors.txt', 20000), '```',
              '## Build (tail)', '```', read('build.log', 12000), '```',
              '## Core tests (tail)', '```', read('core-tests.log', 6000), '```',
              '## Coucou unit tests + Lupy wake test', '```', read('coucou-tests.log', 6000), '```',
            ].join('\n').slice(0, 65000);
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              status: 'completed', conclusion: 'neutral', name: 'Lupy build report',
              output: { title: 'Lupy mac build report', summary },
            });

      - name: Unit tests must pass
        if: always()
        run: |
          test "${{ steps.unittests.outputs.failed }}" = "0" || { echo "Coucou/Lupy unit tests failed:"; grep '^FAIL' coucou-tests.log; exit 1; }

  verify:
    name: verify download (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = the oldest macOS Lupy supports. GitHub retires that runner on 2026-11-02 and fails
        # it during brownouts (actions/runner-images#13518) — switch it to macos-15 after that date.
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5

      - name: Download the published app from GitHub (the exact file the link serves)
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: downloaded
          skip-decompress: true
          digest-mismatch: error

      - name: Artifact record on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          mkdir -p verify-out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            --jq '"name: \(.name)\nsize: \(.size_in_bytes) bytes\ndigest: \(.digest)\nexpires: \(.expires_at)"' \
            | tee verify-out/artifact-record.txt
          ls -la downloaded | tee -a verify-out/artifact-record.txt

      - name: Verify like a person would (unzip, inspect, install, launch)
        env:
          EXPECTED_NAME: ${{ needs.build.outputs.zip_name }}
          EXPECTED_SHA: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          find downloaded -type f > files.txt
          echo "downloaded files: $(wc -l < files.txt | tr -d ' ')"
          test "$(wc -l < files.txt | tr -d ' ')" = 1
          bash scripts/verify-mac-download.sh "$(cat files.txt)" "$EXPECTED_SHA" verify-out "$EXPECTED_NAME"

      - name: Computer control self-test (real Accessibility; the Lupy cursor on screen)
        if: always()
        run: |
          mkdir -p verify-out
          bash scripts/ci-grant-accessibility.sh /Applications/Lupy.app 2>&1 | tee verify-out/control-grant.txt
          bash scripts/ci-control-selftest.sh /Applications/Lupy.app verify-out

      - name: Results on the run page
        if: always()
        run: |
          {
            echo "## Download check on $(sw_vers -productName) $(sw_vers -productVersion)"
            echo '```'
            cat verify-out/verify-report.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report back (check runs with results + screenshots)
        if: always()
        uses: actions/github-script@v8
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const read = (p, n) => { try { return fs.readFileSync(p, 'utf8').slice(-n); } catch { return '(missing)'; } };
            let ver = 'macOS';
            try { ver = 'macOS ' + execSync('sw_vers -productVersion').toString().trim(); } catch {}
            const label = `${ver} (${process.env.RUNNER_LABEL})`;
            const base = { owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, status: 'completed', conclusion: 'neutral' };
            const summary = [
              `## Download check on ${label}`,
              '```', read('verify-out/artifact-record.txt', 3000), '```',
              '```', read('verify-out/verify-report.txt', 42000), '```',
              '## Smoke report (self-test + demo-data launch)', '```', read('verify-out/smoke-report.txt', 12000), '```',
              '## Conversation self-test (island interaction loop)', '```', read('verify-out/chat-selftest.txt', 12000), '```',
            ].join('\n').slice(0, 65000);
            const title = `Lupy download check · ${label}`;
            await github.rest.checks.create({ ...base, name: title, output: { title, summary } });
            const ctl = ['```', read('verify-out/control-grant.txt', 3000), '```', '```', read('verify-out/control-report.txt', 20000), '```', 'App output (tail)', '```', read('verify-out/control-stdout.txt', 6000), '```'].join('\n');
            const ctlTitle = `Lupy computer control · ${label}`;
            await github.rest.checks.create({ ...base, name: ctlTitle, output: { title: ctlTitle, summary: ctl.slice(0, 65000) } });
            for (const [file, what] of [['first-launch', 'first launch'], ['screenshot', 'demo data'], ['island', 'island'], ['rest', 'at rest'],
                                        ['appicon', 'app icon'], ['gatekeeper', 'security prompt'], ['control-overlay', 'cursor overlay'],
                                        ['control-executing-2', 'cursor typing'], ['control-awaiting', 'cursor waiting for approval'],
                                        ['control-sent', 'after approved send']]) {
              let b = '';
              try { b = fs.readFileSync(`verify-out/${file}.b64`, 'utf8'); } catch {}
              if (b.length > 100) {
                const name = `Lupy screenshot · ${label} · ${what}`;
                await github.rest.checks.create({ ...base, name, output: { title: name, summary: 'Base64-encoded JPEG in the text field.', text: b.slice(0, 65000) } });
              }
            }
