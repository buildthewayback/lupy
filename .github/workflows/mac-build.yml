# Lupy native macOS build — deliberately MANUAL to protect the Actions allowance.
#
# Runs only when:
#   - a pushed commit changes ci/mac-build-request.txt (deliberate build request), or
#   - someone clicks "Run workflow" on the Actions tab (workflow_dispatch).
# Other pushes do not start this workflow at all. Commit-message text never triggers it.
# macOS minutes cost ~10x Linux minutes; see docs/CI_BUDGET.md.
name: Mac build (manual)

on:
  push:
    branches: ['arena/**']
    paths: ['ci/mac-build-request.txt']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this build is needed'
        required: false
        default: 'manual build'

permissions:
  contents: read
  checks: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n machdep.cpu.brand_string || true

      - name: Core tests (native Swift)
        run: |
          set -o pipefail
          bash scripts/test-core.sh 2>&1 | tee core-tests.log

      - name: Build Lupy.app
        run: |
          set -o pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          bash scripts/build-mac-app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Self-test and launch smoke test
        run: bash scripts/smoke-mac-app.sh 2>&1 | tee smoke.log

      - name: Report back (check runs with logs + screenshots)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, n) => { try { const s = fs.readFileSync(p, 'utf8'); return s.slice(-n); } catch { return '(missing)'; } };
            const summary = [
              '## Build', '```', read('build.log', 22000), '```',
              '## Smoke + self-test', '```', read('dist/smoke-report.txt', 14000), '```',
              '## Core tests (tail)', '```', read('core-tests.log', 6000), '```',
            ].join('\n').slice(0, 65000);
            const base = { owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, status: 'completed', conclusion: 'neutral' };
            await github.rest.checks.create({ ...base, name: 'Lupy build report', output: { title: 'Lupy mac build report', summary } });
            for (const [file, name] of [['dist/screenshot.b64', 'Lupy screenshot (screen)'], ['dist/island.b64', 'Lupy screenshot (island)']]) {
              let b = '';
              try { b = fs.readFileSync(file, 'utf8'); } catch {}
              if (b.length > 100) {
                await github.rest.checks.create({ ...base, name, output: { title: name, summary: 'Base64-encoded JPEG in the text field.', text: b.slice(0, 65000) } });
              }
            }

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lupy-macOS-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/BUILD_INFO.txt
            dist/smoke-report.txt
            dist/selftest.txt
          retention-days: 14
          if-no-files-found: error
