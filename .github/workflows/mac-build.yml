# Lupy native macOS build — deliberately MANUAL to protect the Actions allowance.
#
# Runs only when:
#   - a pushed commit changes ci/mac-build-request.txt (deliberate build request), or
#   - someone clicks "Run workflow" on the Actions tab (workflow_dispatch).
# Other pushes do not start this workflow at all. Commit-message text never triggers it.
# macOS minutes cost ~10x Linux minutes; see docs/CI_BUDGET.md.
name: Mac build (manual)

on:
  push:
    branches: ['arena/**']
    paths: ['ci/mac-build-request.txt']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this build is needed'
        required: false
        default: 'manual build'

permissions:
  contents: read
  checks: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sysctl -n machdep.cpu.brand_string || true

      - name: Core tests (native Swift)
        run: |
          set -o pipefail
          bash scripts/test-core.sh 2>&1 | tee core-tests.log

      - name: Build Lupy.app
        run: |
          set -o pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          bash scripts/build-mac-app.sh 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Self-test and launch smoke test
        run: bash scripts/smoke-mac-app.sh

      - name: Report back (check run with logs + screenshot)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p, n) => { try { const s = fs.readFileSync(p, 'utf8'); return s.slice(-n); } catch { return '(missing)'; } };
            const summary = [
              '## Core tests', '```', read('core-tests.log', 12000), '```',
              '## Build (tail)', '```', read('build.log', 20000), '```',
              '## Smoke', '```', read('dist/smoke-report.txt', 12000), '```',
            ].join('\n').slice(0, 65000);
            let shot = '';
            try { shot = fs.readFileSync('dist/screenshot.b64', 'utf8'); } catch {}
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Lupy build report', head_sha: context.sha,
              status: 'completed', conclusion: 'neutral',
              output: { title: 'Lupy mac build report', summary, text: shot.slice(0, 65000) || 'no screenshot' },
            });

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lupy-macOS-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/BUILD_INFO.txt
            dist/smoke-report.txt
          retention-days: 14
          if-no-files-found: error
